name: PR Review Checks

on:
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        continue-on-error: true

  review-comment:
    name: Post review checklist
    runs-on: ubuntu-latest

    steps:
      - name: Post automated review checklist
        uses: actions/github-script@v9
        with:
          script: |
            const marker = "<!-- sword-forge-auto-review -->";
            const body = `${marker}
            ## Automated Review Checklist

            This PR is reviewed by GitHub Actions for:

            - Java test suite
            - game-data schema validation
            - balance simulation output
            - dependency changes
            - CodeQL security analysis

            Human review should still check gameplay intent, economy tuning, API compatibility, and migration safety.`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number
            });
            const existing = comments.find(comment => comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }
