spring:
  application:
    name: sword-forge-server
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sword_forge}
    username: ${SPRING_DATASOURCE_USERNAME:sword_forge}
    password: ${SPRING_DATASOURCE_PASSWORD:sword_forge}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  docker:
    compose:
      lifecycle-management: none

server:
  port: ${SERVER_PORT:8080}

app:
  security:
    enabled: ${APP_SECURITY_ENABLED:true}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
