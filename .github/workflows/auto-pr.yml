name: Auto PR

on:
  push:
    branches:
      - "codex/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    name: Open PR to dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create or reuse PR
        env:
          GH_TOKEN: ${{ secrets.PR_AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          BASE_BRANCH: dev
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          if gh pr view "$HEAD_BRANCH" --base "$BASE_BRANCH" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh pr view "$HEAD_BRANCH" --base "$BASE_BRANCH" --repo "$GITHUB_REPOSITORY" --json url --jq .url
            exit 0
          fi

          cat > /tmp/pr_body.md <<'BODY'
          ## Summary

          Automated PR opened from a Codex work branch.

          ## Required Checks

          - CI
          - Balance Simulation
          - PR Review Checks
          - CodeQL

          ## Review Focus

          - gameplay rule regressions
          - economy source/sink balance
          - save migration safety
          - API compatibility
          BODY

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$BASE_BRANCH" \
            --head "$HEAD_BRANCH" \
            --title "Auto PR: $HEAD_BRANCH" \
            --body-file /tmp/pr_body.md
